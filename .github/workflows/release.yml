name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark this as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: livetube-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Run releases from the main branch. You selected '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts |
              head -n 1
          )"

          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi

          TAG="v$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump versionName/versionCode before releasing again."
            exit 1
          fi

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in             ANDROID_KEYSTORE_BASE64             ANDROID_KEYSTORE_PASSWORD             ANDROID_KEY_ALIAS             ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Add the four Android signing secrets in Settings → Secrets and variables → Actions."
            exit 1
          fi

          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/livetube.jks

          # Escape backslashes so Java's .properties parser preserves passwords exactly.
          escape_properties() {
            printf '%s' "$1" | sed 's/\\/\\\\/g'
          }

          {
            printf 'storeFile=keystore/livetube.jks\n'
            printf 'storePassword=%s\n' "$(escape_properties "$ANDROID_KEYSTORE_PASSWORD")"
            printf 'keyAlias=%s\n' "$(escape_properties "$ANDROID_KEY_ALIAS")"
            printf 'keyPassword=%s\n' "$(escape_properties "$ANDROID_KEY_PASSWORD")"
          } > keystore.properties

      - name: Build release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Verify signed APK
        id: apk
        shell: bash
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$SOURCE_APK" ]]; then
            echo "::error::Expected signed APK was not produced at $SOURCE_APK."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Could not find apksigner in the Android SDK."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$SOURCE_APK"

          RELEASE_APK="LiveTube-${{ steps.version.outputs.tag }}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$RELEASE_APK.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "${{ steps.version.outputs.tag }}"
            "${{ steps.apk.outputs.apk }}"
            "${{ steps.apk.outputs.checksum }}"
            --target "$GITHUB_SHA"
            --title "LiveTube ${{ steps.version.outputs.tag }}"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
