name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark this as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: livetube-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Run releases from the main branch. You selected '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts |
              head -n 1
          )"

          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi

          TAG="v$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump versionName/versionCode before releasing again."
            exit 1
          fi

      - name: Restore release signing bundle
        shell: bash
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_SIGNING_BUNDLE_BASE64" ]]; then
            echo "::error::Missing GitHub Actions secret: ANDROID_SIGNING_BUNDLE_BASE64"
            echo "::error::Add the signing bundle under Settings → Secrets and variables → Actions."
            exit 1
          fi

          printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" |
            base64 --decode |
            tar -xzf -

          if [[ ! -f keystore.properties || ! -f keystore/livetube.jks ]]; then
            echo "::error::Signing bundle must contain keystore.properties and keystore/livetube.jks."
            exit 1
          fi

          chmod 600 keystore.properties keystore/livetube.jks

      - name: Verify release signing key
        shell: bash
        run: |
          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' keystore.properties | head -n 1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' keystore.properties | head -n 1)"

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::keystore.properties is missing storePassword or keyAlias."
            exit 1
          fi

          EXPECTED_CERT_SHA256="e886ffeda178fc4e92bcc741f7966c659466c0a6363988c6f1ea027021afc95a"
          ACTUAL_CERT_SHA256="$(
            keytool -list -v               -keystore keystore/livetube.jks               -storepass "$STORE_PASSWORD"               -alias "$KEY_ALIAS" 2>/dev/null |
              sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ -z "$ACTUAL_CERT_SHA256" ]]; then
            echo "::error::Could not read the signing certificate fingerprint from the keystore."
            exit 1
          fi

          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::The signing bundle contains the wrong LiveTube release key."
            echo "::error::Expected SHA-256: $EXPECTED_CERT_SHA256"
            echo "::error::Actual SHA-256:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "LiveTube release signing key verified."

      - name: Build release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Verify signed APK
        id: apk
        shell: bash
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$SOURCE_APK" ]]; then
            echo "::error::Expected signed APK was not produced at $SOURCE_APK."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Could not find apksigner in the Android SDK."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$SOURCE_APK"

          RELEASE_APK="LiveTube-${{ steps.version.outputs.tag }}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$RELEASE_APK.sha256" >> "$GITHUB_OUTPUT"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties
          rm -rf keystore

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "${{ steps.version.outputs.tag }}"
            "${{ steps.apk.outputs.apk }}"
            "${{ steps.apk.outputs.checksum }}"
            --target "$GITHUB_SHA"
            --title "LiveTube ${{ steps.version.outputs.tag }}"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
